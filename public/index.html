<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal+ Tournée</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: white; }
        #map { height: 50vh; width: 100%; }
        .top-bar {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
            display: flex; justify-content: space-between;
        }
        .btn {
            background: #FFD700; border: none; padding: 12px 20px;
            border-radius: 25px; font-weight: bold; cursor: pointer;
            margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .btn-route { background: #00FF88; }
        .pdv-count {
            background: #00BFFF; color: white; padding: 12px 24px;
            border-radius: 25px; font-weight: bold; font-size: 18px;
        }
        .controls { display: flex; flex-direction: column; }
        .route-info {
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px;
            margin-bottom: 10px; font-size: 14px;
        }
        
        /* MODAL CR */
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); z-index: 2000; padding: 15px;
            overflow-y: auto;
        }
        .modal-content {
            background: #1a1a1a; max-width: 500px; margin: 10px auto;
            padding: 20px; border-radius: 15px; border: 1px solid #333;
        }
        .modal h2 { margin-bottom: 15px; color: #00BFFF; }
        .modal input, .modal textarea {
            width: 100%; padding: 12px; margin-bottom: 8px;
            border: 1px solid #444; border-radius: 8px; background: #0a0a0a;
            color: white; font-size: 15px;
        }
        .modal small { color: #888; font-size: 11px; display: block; margin: -5px 0 8px; }
        .modal-row { display: flex; gap: 8px; }
        .modal-row input { flex: 1; }
        .modal-buttons { display: flex; gap: 8px; margin-top: 15px; }
        .btn-green { background: #00FF00; color: black; flex: 1; }
        .btn-cyan { background: #00FFFF; color: black; flex: 1; }
        .btn-red { background: #FF0000; flex: 1; }
        
        /* LISTE PDV */
        .liste-container {
            background: #1a1a1a; padding: 15px; height: 50vh; overflow-y: auto;
        }
        .liste-container h3 { margin-bottom: 10px; color: #00BFFF; }
        .pdv-item {
            background: #0a0a0a; padding: 12px; margin-bottom: 10px;
            border-radius: 10px; border-left: 4px solid #00BFFF;
        }
        .pdv-item b { color: #FFD700; }
        .btn-share {
            width: 100%; padding: 15px; margin-top: 10px;
            border: none; border-radius: 10px; font-weight: bold; font-size: 16px;
            cursor: pointer;
        }
        .btn-whatsapp { background: #00FF00; color: black; }
        .btn-mail { background: #FF00FF; color: white; }
        
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #FF00FF; color: white; padding: 15px 25px; border-radius: 10px;
            z-index: 3000; display: none; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="top-bar">
        <div class="controls">
            <div class="route-info" id="route-info" style="display:none;">
                <div id="route-dist">214.0 m, 30 s</div>
                <div id="route-steps">Head north<br>Turn left</div>
            </div>
            <button class="btn" id="btn-gps">📍 GPS</button>
            <button class="btn" id="btn-add">+ ADD</button>
            <button class="btn btn-route" id="btn-route">🗺️ ROUTE</button>
        </div>
        <div class="pdv-count" id="pdv-count">1 PDV</div>
    </div>

    <div class="liste-container">
        <h3>Avancement: <span id="avancement">0/0</span> PDV visités</h3>
        <div id="pdv-list"></div>
        <button class="btn-share btn-whatsapp" id="btn-share-wa">📱 PARTAGER WHATSAPP</button>
        <button class="btn-share btn-mail" id="btn-send-boss">📧 ENVOYER COMPTE RENDU AU BOSS</button>
    </div>

    <!-- MODAL COMPTE RENDU -->
    <div class="modal" id="modal-cr">
        <div class="modal-content">
            <h2>Envoyer Compte Rendu</h2>
            <input type="text" id="cr-nom" placeholder="Nom" value="Armel">
            <input type="email" id="cr-email-from" placeholder="Ton email" value="guigmapokoarmel@gmail.com">
            <input type="password" id="cr-password" placeholder="Mot de passe d'app">
            <small>Outlook: Activer 2FA + mot de passe d'app<br>Google: Sécurité > Mots de passe des applications</small>
            <input type="email" id="cr-email-to" placeholder="Email du boss" value="armel.guigma@canal-plus.com">
            <div class="modal-row">
                <input type="number" id="cr-stock" placeholder="Stock PDV">
                <input type="number" id="cr-credit" placeholder="Crédit FCFA">
            </div>
            <div class="modal-row">
                <input type="number" id="cr-recrut" placeholder="Recrutement">
                <input type="number" id="cr-reab" placeholder="Réabonnement">
            </div>
            <textarea id="cr-comment" rows="3" placeholder="Commentaire général..."></textarea>
            <div class="modal-buttons">
                <button class="btn btn-green" id="btn-whatsapp">📱 WHATSAPP</button>
                <button class="btn btn-cyan" id="btn-envoyer">📧 ENVOYER</button>
                <button class="btn btn-red" id="btn-annuler">ANNULER</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = '/api/points';
        const API_MAIL = '/api/tournee-mail';
        let points = 0;
        let map;
        let myMarker;
        let pdvList = [];
        let currentLat = 0, currentLon = 0;

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                points = data.points;
                pdvList = data.pdvList || [];
                document.getElementById('pdv-count').textContent = points + ' PDV';
                updateListePDV();
            } catch (e) {
                toast('Erreur réseau : Backend coupé ?');
            }
        }

        function initMap() {
            map = L.map('map').setView([6.3728, 2.3544], 13); // Porto-Novo
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }

        function getGPS() {
            navigator.geolocation.getCurrentPosition(pos => {
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
                map.setView([currentLat, currentLon], 16);
                if (myMarker) map.removeLayer(myMarker);
                myMarker = L.marker([currentLat, currentLon]).addTo(map).bindPopup('TOI').openPopup();
                document.getElementById('route-info').style.display = 'block';
            }, () => toast('Erreur GPS'));
        }

        function showModal() {
            document.getElementById('modal-cr').style.display = 'block';
        }

        function hideModal() {
            document.getElementById('modal-cr').style.display = 'none';
        }

        function updateListePDV() {
            const container = document.getElementById('pdv-list');
            container.innerHTML = '';
            pdvList.forEach(p => {
                const div = document.createElement('div');
                div.className = 'pdv-item';
                div.innerHTML = `
                    <b>${p.nom}</b> - ${p.date}<br>
                    Stock: ${p.stock} | Crédit: ${p.credit} FCFA<br>
                    Recrut: ${p.recrut} | Réab: ${p.reab}<br>
                    <small>${p.commentaire}</small>
                `;
                container.appendChild(div);
            });
            document.getElementById('avancement').textContent = `${pdvList.length}/${points}`;
        }

        async function envoyerCR() {
            const data = {
                nom: document.getElementById('cr-nom').value,
                emailFrom: document.getElementById('cr-email-from').value,
                password: document.getElementById('cr-password').value,
                emailTo: document.getElementById('cr-email-to').value,
                stock: document.getElementById('cr-stock').value,
                credit: document.getElementById('cr-credit').value,
                recrut: document.getElementById('cr-recrut').value,
                reab: document.getElementById('cr-reab').value,
                commentaire: document.getElementById('cr-comment').value,
                lat: currentLat,
                lon: currentLon
            };

            if (!data.password) {
                toast('Mot de passe d\'app requis !');
                return;
            }

            try {
                const res = await fetch(API_MAIL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    toast('CR envoyé au boss !');
                    hideModal();
                    points++;
                    pdvList.unshift({ ...data, date: new Date().toLocaleString('fr-FR') });
                    document.getElementById('pdv-count').textContent = points + ' PDV';
                    updateListePDV();
                    // Save to backend
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ points, pdv: data })
                    });
                } else {
                    toast('Erreur: ' + result.error);
                }
            } catch (e) {
                toast('Erreur réseau: Unexpected token');
            }
        }

        function partagerWhatsApp() {
            const data = {
                nom: document.getElementById('cr-nom').value,
                stock: document.getElementById('cr-stock').value,
                credit: document.getElementById('cr-credit').value,
                recrut: document.getElementById('cr-recrut').value,
                reab: document.getElementById('cr-reab').value,
                comment: document.getElementById('cr-comment').value
            };
            const msg = `*CR Tournée Canal+*%0A%0A*Commercial:* ${data.nom}%0A*Stock PDV:* ${data.stock}%0A*Crédit:* ${data.credit} FCFA%0A*Recrutement:* ${data.recrut}%0A*Réabonnement:* ${data.reab}%0A*Commentaire:* ${data.comment}%0A*GPS:* ${currentLat},${currentLon}`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        // EVENTS
        document.getElementById('btn-gps').onclick = getGPS;
        document.getElementById('btn-add').onclick = showModal;
        document.getElementById('btn-route').onclick = () => {
            document.getElementById('route-info').style.display = 'block';
            toast('Itinéraire activé');
        };
        document.getElementById('btn-annuler').onclick = hideModal;
        document.getElementById('btn-envoyer').onclick = envoyerCR;
        document.getElementById('btn-whatsapp').onclick = partagerWhatsApp;
        document.getElementById('btn-send-boss').onclick = showModal;
        document.getElementById('btn-share-wa').onclick = () => {
            const msg = `*Résumé Tournée*%0A${pdvList.length} PDV visités%0ATotal: ${points} PDV%0A%0A${pdvList.map(p=>`- ${p.nom}: ${p.stock} stock`).join('%0A')}`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        };

        window.onload = () => {
            initMap();
            loadData();
            getGPS();
        };
    </script>
</body>
</html>
